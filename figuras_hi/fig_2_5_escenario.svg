<svg width="2208" height="864" viewBox="0 0 920 360" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/></marker></defs>
<rect width="920" height="360" fill="#ffffff"/>
<text x="460" y="30" font-size="18" fill="#3b6ea5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Modelo de Escenario y derivación desde el LEL</text>
<rect x="40" y="110" width="150" height="64" rx="8" fill="#e8eef7" stroke="#3b6ea5" stroke-width="2"/>
<text x="115.0" y="138.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">LEL (Sujeto / Objeto</text>
<text x="115.0" y="154.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">/ Verbo)</text>
<rect x="330" y="70" width="560" height="250" rx="8" fill="#fbfcfe" stroke="#3b6ea5" stroke-width="2"/>
<text x="610" y="96" font-size="16" fill="#3b6ea5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Escenario</text>
<text x="350" y="126" font-size="13" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" >• Título</text>
<text x="350" y="156" font-size="13" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" >• Objetivo</text>
<text x="350" y="186" font-size="13" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" >• Contexto (precondición, ubicación temporal y geográfica)</text>
<text x="350" y="216" font-size="13" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" >• Recursos</text>
<text x="350" y="246" font-size="13" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" >• Actores</text>
<text x="350" y="276" font-size="13" fill="#1f2937" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" >• Episodios (serie de acciones; con excepciones)</text>
<line x1="190" y1="150" x2="330" y2="150" stroke="#3f7d5b" stroke-width="2"  marker-end="url(#ah)"/>
<rect x="222.0" y="140.0" width="76.0" height="18" rx="4" fill="#ffffff" opacity="0.9"/>
<text x="260.0" y="153.0" font-size="12" fill="#3f7d5b" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">Derivación</text>
<text x="255" y="200" font-size="11" fill="#5b6470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >Sujeto→Actor</text>
<text x="255" y="218" font-size="11" fill="#5b6470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >Objeto→Recurso</text>
<text x="255" y="236" font-size="11" fill="#5b6470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >Verbo→Episodio/Título</text>
</svg>
