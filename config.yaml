# Configuración del prototipo de construcción del LEL con IA Generativa
# Elegí "la que mejor funcione" corriendo el experimento con cada proveedor/modelo.

proveedor: anthropic        # openai | anthropic | echo (echo = sin red, solo valida)
modelo: "claude-sonnet-4-6" # COMPLETAR con el modelo vigente del proveedor elegido
temperatura: 0.2            # baja, para favorecer reproducibilidad
max_tokens: 8000            # holgura para la etapa 4, cuya salida es un LEL completo

# Modelos sugeridos para el benchmarking (completar con los nombres vigentes):
#   openai    -> p. ej. un modelo GPT de la familia disponible
#   anthropic -> p. ej. un modelo de la familia disponible
#   local     -> exponer un endpoint compatible con OpenAI y usar proveedor: openai

# Corpus de entrada: las cuatro entrevistas reales del estudio original de ecoFactory
# (ver data/corpus/NOTA_CORPUS.md). Todos los tratamientos usan este mismo corpus.
corpus:
  - data/corpus/entrevista_1_dueno.txt
  - data/corpus/entrevista_2_gerente_comercial.txt
  - data/corpus/entrevista_3_operario.txt
  - data/corpus/entrevista_4_responsable_erp.txt

gold:
  completo: data/gold/gs_completo.json
  corpus: data/gold/gs_corpus.json
  
corpora:
  - nombre: "ecoFactory — entrevistas reales (WER 2024)"
    archivos:
      - data/corpus/entrevista_1_dueno.txt
      - data/corpus/entrevista_2_gerente_comercial.txt
      - data/corpus/entrevista_3_operario.txt
      - data/corpus/entrevista_4_responsable_erp.txt
    gold:
      "GS-Corpus (15)": data/gold/gs_corpus.json
      "GS-Completo (21)": data/gold/gs_completo.json

  - nombre: "Veterinaria — caso de muestreo"
    archivos:
      - data/muestreo/entrevista_1_veterinario.txt
      - data/muestreo/entrevista_2_recepcionista.txt
    gold:
      "LEL de referencia (16)": data/muestreo/gold_veterinaria.json

  - nombre: "Consultorio médico — caso de muestreo"
    archivos:
      - data/muestreo/med_1_medico.txt
      - data/muestreo/med_2_secretaria.txt
    gold:
      "LEL de referencia": data/muestreo/gold_consultorio.json

  - nombre: "E-commerce — caso de muestreo"
    archivos:
      - data/muestreo/ecom_1_dueno.txt
      - data/muestreo/ecom_2_logistica.txt
    gold:
      "LEL de referencia": data/muestreo/gold_e-commerce.json

  - nombre: "Tintorería — corpus de prueba (sin referencia)"
    archivos:
      - data/pruebas/entrevista_tintoreria_TEST.txt