<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/></marker></defs>
<rect width="900" height="360" fill="#ffffff"/>
<text x="450" y="30" font-size="18" fill="#3b6ea5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Arquitectura Transformer (esquema simplificado)</text>
<rect x="40" y="150" width="120" height="60" rx="8" fill="#eef1f4" stroke="#5b6470" stroke-width="2"/>
<text x="100.0" y="176.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >Tokens de</text>
<text x="100.0" y="192.0" font-size="12" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >entrada</text>
<rect x="190" y="150" width="130" height="60" rx="8" fill="#e8eef7" stroke="#3b6ea5" stroke-width="2"/>
<text x="255.0" y="168.5" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >Embeddings +</text>
<text x="255.0" y="183.5" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >Codificación</text>
<text x="255.0" y="198.5" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >posicional</text>
