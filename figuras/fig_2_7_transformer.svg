<text x="450" y="320" font-size="12" fill="#5b6470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >La autoatención pondera la relevancia de cada token respecto de los demás; el modelo predice el token siguiente de manera autorregresiva.</text>
