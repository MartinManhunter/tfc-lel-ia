<rect x="700" y="150" width="150" height="60" rx="8" fill="#fff6e0" stroke="#c08a00" stroke-width="2"/>
<text x="775.0" y="168.5" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >Distribución sobre el</text>
<text x="775.0" y="183.5" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >vocabulario → token</text>
<text x="775.0" y="198.5" font-size="11" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" >siguiente</text>
