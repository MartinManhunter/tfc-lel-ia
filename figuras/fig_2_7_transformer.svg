<text x="510" y="112" font-size="14" fill="#3b6ea5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Bloque ×N</text>
<rect x="380" y="130" width="260" height="56" rx="8" fill="#f6e7e9" stroke="#b23a48" stroke-width="2"/>
<text x="510.0" y="162.5" font-size="13" fill="#1f2937" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Autoatención (multi-cabezal)</text>
